# Training Configuration

# Model
student_model:
  name: "gpt2"  # or: "llama2-7b", "mistral-7b", custom path
  vocab_size: 50257

# Training
training:
  batch_size: 8
  learning_rate: 5e-5
  num_epochs: 3
  warmup_steps: 100
  max_seq_length: 512
  gradient_accumulation_steps: 1

# Distillation
distillation:
  temperature: 2.0
  alpha: 0.5  # weight for KL divergence loss (1-alpha for cross-entropy)

# Data
data:
  train_path: "data/processed/train.jsonl"
  val_path: "data/processed/val.jsonl"
  cache_path: "data/cache"

# Checkpoints
checkpoints:
  save_dir: "checkpoints"
  save_steps: 500
  keep_last_n: 3

# Hardware
hardware:
  device: "cuda"  # or "cpu"
  num_workers: 4